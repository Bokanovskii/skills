<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Proposed project picker</title>
<style>
  *{box-sizing:border-box}body{margin:0;padding:30px;background:#0d1016;color:#e9e9ef;font:15px/1.5 system-ui,sans-serif}.picker{max-width:660px;margin:auto;border:1px solid #343743;border-radius:14px;background:#13161e;overflow:hidden}.head{padding:20px 24px;border-bottom:1px solid #30333f;display:flex;align-items:center;justify-content:space-between}h1{font-size:20px;margin:0}.hint{color:#a1a5b2;font-size:12px}.content{padding:20px 24px}.search{display:flex;gap:12px;align-items:center;color:#a1a5b2;background:#0d1016;border:1px solid #494d5c;border-radius:9px;padding:12px 14px}.search svg{width:18px;height:18px;flex-shrink:0}.label{margin:20px 0 8px;color:#a1a5b2;font-size:12px}.row{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:8px}.row.selected{background:#242d40;border:1px solid #445777}.icon{width:32px;height:32px;border:1px solid #484e62;border-radius:8px;display:grid;place-items:center;background:#202632;font-weight:650}.name{flex:1}.selected-label{color:#98bfff;font-size:12px}.footer{display:flex;justify-content:space-between;align-items:center;padding:15px 24px;border-top:1px solid #30333f}.button{background:#ce3939;color:white;font-size:13px;font-weight:650;padding:9px 14px;border-radius:7px}.sub{color:#a1a5b2;font-size:12px}@media(max-width:500px){body{padding:18px}.head,.content{padding:16px}.footer{padding:14px 16px}.hint{display:none}}
</style></head><body>
<div class="picker">
  <div class="head"><h1>Open a project</h1><span class="hint">Choose a workspace</span></div>
  <div class="content">
    <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 5 5"/></svg>Search projects...</div>
    <p class="label">Recent projects</p>
    <div class="row selected"><span class="icon">W</span><span class="name">Website</span><span class="selected-label">Selected</span></div>
    <div class="row"><span class="icon">D</span><span class="name">Documentation</span></div>
    <div class="row"><span class="icon">T</span><span class="name">Data tools</span></div>
  </div>
  <div class="footer"><span class="sub">Website is selected</span><span class="button">Open project</span></div>
</div>
</body></html>
