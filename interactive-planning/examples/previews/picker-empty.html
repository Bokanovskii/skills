<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Proposed empty search</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:30px;background:#0d1016;color:#e9e9ef;font:15px/1.5 system-ui,sans-serif}.picker{max-width:660px;margin:auto;border:1px solid #343743;border-radius:14px;background:#13161e;overflow:hidden}.head{padding:20px 24px;border-bottom:1px solid #30333f;font-size:20px;font-weight:650}.content{padding:20px 24px}.search{background:#0d1016;border:1px solid #494d5c;border-radius:9px;padding:12px 14px}.empty{text-align:center;padding:32px 12px 16px}.empty h1{font-size:18px;margin:0 0 8px}.empty p{color:#a1a5b2;font-size:14px;margin:0 0 20px}.button{display:inline-block;border:1px solid #4b5061;border-radius:7px;padding:9px 15px;font-size:13px;font-weight:600;background:#1a1e29}@media(max-width:500px){body{padding:18px}.head,.content{padding:16px}}
</style></head><body>
<div class="picker"><div class="head">Open a project</div><div class="content">
<div class="search">mobile-site</div>
<div class="empty"><h1>No matching projects</h1><p>Try another name, or return to recent projects.</p><span class="button">Clear search</span></div>
</div></div>
</body></html>
